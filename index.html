<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maszyna Bingo - Animacja Kasyno</title>
    <style>
        * { 
            box-sizing: border-box; 
        }
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: #ffffff;
            padding: 20px; 
            margin: 0;
            min-height: 100vh;
        }
        h1 { 
            margin-top: 10px; 
            font-size: 38px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            letter-spacing: 2px;
        }
        
        .wynik-karta {
            background-color: #ffffff;
            color: #ff4757; 
            font-size: 90px;
            font-weight: 900;
            margin: 30px auto;
            padding: 40px 20px;
            border-radius: 25px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            max-width: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px; /* Stała wysokość zapobiega skakaniu ekranu */
            overflow: hidden;
        }

        /* --- ANIMACJE KASYNOWE --- */
        .spinning {
            color: #7f8fa6; /* Szarawy kolor podczas kręcenia */
            animation: slot-machine 0.08s infinite linear; /* Bardzo szybkie "trzęsienie" */
        }

        .pop {
            color: #ff4757; /* Powrót do czerwonego */
            animation: pop-out 0.4s ease-out;
        }

        @keyframes slot-machine {
            0% { transform: translateY(-10px); filter: blur(2px); opacity: 0.8; }
            50% { transform: translateY(10px); filter: blur(0px); opacity: 1; }
            100% { transform: translateY(-10px); filter: blur(2px); opacity: 0.8; }
        }

        @keyframes pop-out {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        
        button { 
            font-size: 28px; 
            font-weight: bold;
            padding: 20px 40px; 
            background: linear-gradient(135deg, #fc4a1a 0%, #f7b733 100%);
            color: white; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            width: 100%; 
            max-width: 350px; 
            box-shadow: 0 10px 25px rgba(252, 74, 26, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:active { 
            transform: translateY(5px); 
            box-shadow: 0 5px 15px rgba(252, 74, 26, 0.4);
        }
        button:disabled {
            background: #95a5a6;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .historia { 
            margin-top: 40px; 
            font-size: 18px; 
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px; 
            border-radius: 20px; 
            text-align: left;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .historia-naglowek { 
            margin-bottom: 15px;
        }
        .historia-naglowek span { 
            color: #f7b733; 
            font-weight: bold; 
            font-size: 20px;
        }
        
        #lista-wylosowanych {
            display: flex;
            flex-wrap: wrap; 
            gap: 10px;       
            justify-content: center;
        }

        .kafelek {
            background: rgba(255, 255, 255, 0.2); 
            border: 1px solid rgba(255, 255, 255, 0.4); 
            border-radius: 12px; 
            padding: 10px 5px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            min-width: 50px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            /* Pojawienie się nowego kafelka z małą animacją */
            animation: pop-out 0.3s ease-out;
        }
    </style>
</head>
<body>

    <h1>BINGO</h1>
    
    <div class="wynik-karta">
        <span id="wynik">???</span>
    </div>
    
    <button onclick="losuj()" id="przycisk">LOSUJ</button>

    <div class="historia">
        <div class="historia-naglowek">
            Wylosowane liczby (<span><span id="licznik">0</span>/75</span>):
        </div>
        <div id="lista-wylosowanych"></div>
    </div>

    <script>
        let pula = [];
        for (let i = 1; i <= 75; i++) pula.push(i);
        
        let wylosowane = [];
        let czyLosuje = false; // Zapobiega klikaniu podczas animacji

        function przypiszLitere(liczba) {
            if (liczba <= 15) return "B";
            if (liczba <= 30) return "I";
            if (liczba <= 45) return "N";
            if (liczba <= 60) return "G";
            return "O";
        }

        function losuj() {
            // Zablokuj, jeśli już losuje lub brak liczb
            if (czyLosuje || pula.length === 0) return;
            
            czyLosuje = true;
            let btn = document.getElementById("przycisk");
            let wynikDiv = document.getElementById("wynik");
            btn.disabled = true;

            // Ustalamy faktyczny wynik
            let index = Math.floor(Math.random() * pula.length);
            let prawdziwaLiczba = pula.splice(index, 1)[0];
            let prawdziwaLitera = przypiszLitere(prawdziwaLiczba);

            // ANIMACJA: "Slot machine" effect
            let licznikKlatek = 0;
            let maksymalnaLiczbaKlatek = 15; // Ilość "mignięć"
            let czasMiedzyKlatkami = 60; // Szybkość migania w milisekundach

            wynikDiv.classList.remove("pop");
            wynikDiv.classList.add("spinning");

            let interwalLosowania = setInterval(() => {
                // Generuj fałszywą liczbę tylko na potrzeby animacji
                let falszywaLiczba = Math.floor(Math.random() * 75) + 1;
                wynikDiv.innerText = przypiszLitere(falszywaLiczba) + " " + falszywaLiczba;
                
                licznikKlatek++;

                // Koniec kręcenia
                if (licznikKlatek >= maksymalnaLiczbaKlatek) {
                    clearInterval(interwalLosowania);
                    zakonczLosowanie(prawdziwaLiczba, prawdziwaLitera);
                }
            }, czasMiedzyKlatkami);
        }

        function zakonczLosowanie(liczba, litera) {
            let btn = document.getElementById("przycisk");
            let wynikDiv = document.getElementById("wynik");

            // Ustaw prawdziwy wynik i zmień animację na "wyskoczenie" (pop)
            wynikDiv.classList.remove("spinning");
            wynikDiv.innerText = litera + " " + liczba;
            wynikDiv.classList.add("pop");

            // Aktualizuj historię
            wylosowane.push(liczba);
            wylosowane.sort((a, b) => a - b);
            document.getElementById("licznik").innerText = wylosowane.length;

            let kafelkiHTML = wylosowane.map(num => {
                let lit = przypiszLitere(num);
                // Wyróżniamy ostatnio wylosowaną liczbę w historii ciemniejszym kolorem ramki dla czytelności (opcjonalnie)
                let extraStyl = (num === liczba) ? 'style="background: rgba(255,255,255,0.4); border: 2px solid white;"' : '';
                return `<div class="kafelek" ${extraStyl}>${lit}${num}</div>`;
            }).join("");

            document.getElementById("lista-wylosowanych").innerHTML = kafelkiHTML;

            // Zakończ proces i odblokuj przycisk, jeśli są jeszcze liczby
            czyLosuje = false;
            
            if (pula.length === 0) {
                btn.innerText = "Wszystkie wylosowane!";
            } else {
                btn.disabled = false;
            }
        }
    </script>

</body>
</html>
