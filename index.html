<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maszyna Bingo</title>
    <style>
        * { 
            box-sizing: border-box; 
        }
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: #ffffff;
            padding: 20px; 
            margin: 0;
            min-height: 100vh;
        }
        h1 { 
            margin-top: 10px; 
            font-size: 38px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            letter-spacing: 2px;
        }
        
        .wynik-karta {
            background-color: #ffffff;
            color: #ff4757; 
            font-size: 90px;
            font-weight: 900;
            margin: 30px auto;
            padding: 40px 20px;
            border-radius: 25px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            max-width: 320px;
        }
        
        button { 
            font-size: 28px; 
            font-weight: bold;
            padding: 20px 40px; 
            background: linear-gradient(135deg, #fc4a1a 0%, #f7b733 100%);
            color: white; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            width: 100%; 
            max-width: 350px; 
            box-shadow: 0 10px 25px rgba(252, 74, 26, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:active { 
            transform: translateY(5px); 
            box-shadow: 0 5px 15px rgba(252, 74, 26, 0.4);
        }
        button:disabled {
            background: #bdc3c7;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .historia { 
            margin-top: 40px; 
            font-size: 18px; 
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px; 
            border-radius: 20px; 
            text-align: left;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .historia-naglowek { 
            margin-bottom: 15px;
        }
        .historia-naglowek span { 
            color: #f7b733; 
            font-weight: bold; 
            font-size: 20px;
        }
        
        /* Styl dla historii liczb (pojemnik) */
        #lista-wylosowanych {
            display: flex;
            flex-wrap: wrap; /* Zawija kafelki do nowej linii, gdy brakuje miejsca */
            gap: 10px;       /* Odstęp między kafelkami */
            justify-content: center;
        }

        /* Styl dla pojedynczego, zaoblonego kwadratu */
        .kafelek {
            background: rgba(255, 255, 255, 0.2); /* Lekko przezroczyste tło */
            border: 1px solid rgba(255, 255, 255, 0.4); /* Jasna ramka */
            border-radius: 12px; /* Zaokrąglone rogi (kształt kwadratu/prostokąta) */
            padding: 10px 5px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            min-width: 50px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <h1>BINGO</h1>
    
    <div class="wynik-karta" id="wynik">???</div>
    
    <button onclick="losuj()" id="przycisk">LOSUJ</button>

    <div class="historia">
        <div class="historia-naglowek">
            Wylosowane liczby (<span><span id="licznik">0</span>/75</span>):
        </div>
        <!-- Tutaj wpadną kafelki -->
        <div id="lista-wylosowanych"></div>
    </div>

    <script>
        let pula = [];
        for (let i = 1; i <= 75; i++) pula.push(i);
        
        let wylosowane = [];

        // Funkcja pomocnicza - sprawdza jaka litera odpowiada liczbie
        function przypiszLitere(liczba) {
            if (liczba <= 15) return "B";
            if (liczba <= 30) return "I";
            if (liczba <= 45) return "N";
            if (liczba <= 60) return "G";
            return "O";
        }

        function losuj() {
            if (pula.length === 0) {
                document.getElementById("wynik").innerText = "KONIEC";
                document.getElementById("wynik").style.fontSize = "60px";
                let btn = document.getElementById("przycisk");
                btn.disabled = true;
                btn.innerText = "Wszystkie wylosowane!";
                return;
            }

            // Losowanie
            let index = Math.floor(Math.random() * pula.length);
            let liczba = pula.splice(index, 1)[0];
            
            // Dodanie do historii i sortowanie od najmniejszej do największej
            wylosowane.push(liczba);
            wylosowane.sort((a, b) => a - b);

            let litera = przypiszLitere(liczba);

            // Główny wynik na ekranie
            document.getElementById("wynik").innerText = litera + " " + liczba;
            document.getElementById("licznik").innerText = wylosowane.length;

            // Tworzenie HTML dla historii (zamiana liczb na "kafelki")
            let kafelkiHTML = wylosowane.map(num => {
                let lit = przypiszLitere(num);
                return `<div class="kafelek">${lit}${num}</div>`;
            }).join("");

            document.getElementById("lista-wylosowanych").innerHTML = kafelkiHTML;
        }
    </script>

</body>
</html>
