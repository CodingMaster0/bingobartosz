<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maszyna Bingo - Brand New Chanel$ Edition</title>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            
            /* --- TUTAJ DODANE ZDJĘCIE JAKO TŁO --- */
            background-image: url('8bf716558c71408f075dc2e8411f1106.1000x1000x1.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            
            color: #ffffff;
            padding: 20px 10px; 
            margin: 0;
            min-height: 100vh;
        }

        /* --- OBUDOWA MASZYNY --- */
        .maszyna-kasyno {
            background: linear-gradient(180deg, rgba(31, 8, 6, 0.9) 0%, rgba(10, 2, 2, 0.95) 100%); 
            border-radius: 30px;
            padding: 20px;
            max-width: 400px;
            margin: 0 auto;
            border: 6px solid;
            border-image: linear-gradient(to bottom right, #ffcc00, #ff6600, #cc0000, #ff9900) 1;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9), inset 0 10px 20px rgba(255, 100, 0, 0.1);
            position: relative;
            backdrop-filter: blur(10px); /* Efekt szkła nad zdjęciem */
        }

        /* Szyld */
        .szyld {
            background: transparent;
            color: #00ffff; 
            font-size: 34px;
            font-weight: 900;
            font-style: italic; 
            letter-spacing: 1px;
            text-transform: lowercase; 
            padding: 10px 10px;
            margin-bottom: 25px;
            text-shadow: 0 0 8px #00ffff, 0 0 15px #00e5ff, 0 0 25px rgba(0, 255, 255, 0.8);
            animation: pulsowanie-napis 2s infinite alternate;
        }

        @keyframes pulsowanie-napis {
            from { filter: brightness(1); text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff; }
            to { filter: brightness(1.2); text-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff, 0 0 40px #00ffff; }
        }

        /* Ramka ze światełkami */
        .ramka-swiatla {
            background: #110505;
            padding: 10px;
            border-radius: 20px;
            border: 4px dashed #ffcc00; 
            margin-bottom: 30px;
            position: relative;
        }

        .migajace-swiatla {
            animation: swiatla-kasyna 0.15s infinite alternate;
        }

        @keyframes swiatla-kasyna {
            0% { border-color: #ff3300; box-shadow: 0 0 20px #ff3300; }
            50% { border-color: #ffcc00; box-shadow: 0 0 20px #ffcc00; }
            100% { border-color: #00ffff; box-shadow: 0 0 25px #00ffff; }
        }

        /* Bęben losujący */
        .ekran-walec {
            background-color: #0a0101; 
            height: 180px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 20px 30px rgba(0,0,0,1);
            border: 1px solid #3a0a0a;
        }

        .ekran-walec::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            z-index: 2; pointer-events: none;
        }
        .ekran-walec::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 50px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            z-index: 2; pointer-events: none;
        }

        #wynik {
            color: #ffcc00; 
            font-size: 85px;
            font-weight: 900;
            z-index: 1;
            text-shadow: 0 0 15px #ff6600, 0 0 30px #cc0000;
        }

        .spinning {
            color: #552200 !important;
            animation: kręcenie-bebna 0.08s infinite linear;
            text-shadow: none !important;
        }
        .pop {
            color: #ffcc00 !important;
            animation: pop-out 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes kręcenie-bebna {
            0% { transform: translateY(-30px); filter: blur(4px); opacity: 0.6; }
            50% { transform: translateY(30px); filter: blur(2px); opacity: 1; }
            100% { transform: translateY(-30px); filter: blur(4px); opacity: 0.6; }
        }
        @keyframes pop-out {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- GUZIK --- */
        .guzik-automat {
            background: #00ffff;
            color: #000000;
            font-size: 30px;
            font-weight: 900;
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 0 #008b8b, 0 15px 25px rgba(0, 255, 255, 0.4);
            transition: all 0.1s;
            margin-bottom: 10px;
        }

        .guzik-automat:active {
            transform: translateY(10px);
            box-shadow: 0 0px 0 #008b8b, 0 5px 15px rgba(0, 255, 255, 0.4);
            background: #00e5ff;
        }

        .guzik-automat:disabled {
            background: #333;
            color: #666;
            box-shadow: 0 10px 0 #111;
            cursor: not-allowed;
            transform: none;
        }

        /* --- HISTORIA --- */
        .historia { 
            margin-top: 30px; 
            background: rgba(20, 5, 5, 0.75); /* Zwiększona przezroczystość, by widzieć tło */
            padding: 20px; 
            border-radius: 20px; 
            text-align: left;
            border: 1px solid rgba(255, 100, 0, 0.3);
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            backdrop-filter: blur(8px); /* Piękne rozmycie fajerwerków w tle */
        }
        .historia-naglowek { margin-bottom: 15px; font-size: 18px; color: #ffcc00; }
        .historia-naglowek span { color: #00ffff; font-weight: bold; font-size: 20px; }
        
        #lista-wylosowanych {
            display: flex;
            flex-wrap: wrap; 
            gap: 8px;       
            justify-content: center;
        }

        .kafelek {
            background: rgba(42, 8, 8, 0.8); 
            border: 1px solid #ff6600; 
            border-radius: 8px; 
            padding: 8px 12px;
            font-size: 15px;
            font-weight: bold;
            color: #ffcc00;
            min-width: 45px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            animation: pop-out 0.3s ease-out;
        }
    </style>
</head>
<body>

    <div class="maszyna-kasyno">
        <div class="szyld">brand new bingo$</div>
        
        <div class="ramka-swiatla" id="ramka">
            <div class="ekran-walec">
                <div id="wynik">???</div>
            </div>
        </div>
        
        <button class="guzik-automat" onclick="losuj()" id="przycisk">ZAKRĘĆ</button>
    </div>

    <div class="historia">
        <div class="historia-naglowek">
            Wylosowane (<span><span id="licznik">0</span>/75</span>):
        </div>
        <div id="lista-wylosowanych"></div>
    </div>

    <script>
        let pula = [];
        for (let i = 1; i <= 75; i++) pula.push(i);
        
        let wylosowane = [];
        let czyLosuje = false;

        function przypiszLitere(liczba) {
            if (liczba <= 15) return "B";
            if (liczba <= 30) return "I";
            if (liczba <= 45) return "N";
            if (liczba <= 60) return "G";
            return "O";
        }

        function losuj() {
            if (czyLosuje || pula.length === 0) return;
            czyLosuje = true;
            
            let btn = document.getElementById("przycisk");
            let wynikDiv = document.getElementById("wynik");
            let ramka = document.getElementById("ramka");
            btn.disabled = true;

            ramka.classList.add("migajace-swiatla");
            wynikDiv.classList.remove("pop");
            wynikDiv.classList.add("spinning");

            let index = Math.floor(Math.random() * pula.length);
            let prawdziwaLiczba = pula.splice(index, 1)[0];
            let prawdziwaLitera = przypiszLitere(prawdziwaLiczba);

            let licznikKlatek = 0;
            let maksymalnaLiczbaKlatek = 18; 
            let czasMiedzyKlatkami = 60; 

            let interwalLosowania = setInterval(() => {
                let falszywaLiczba = Math.floor(Math.random() * 75) + 1;
                wynikDiv.innerText = przypiszLitere(falszywaLiczba) + " " + falszywaLiczba;
                licznikKlatek++;

                if (licznikKlatek >= maksymalnaLiczbaKlatek) {
                    clearInterval(interwalLosowania);
                    zakonczLosowanie(prawdziwaLiczba, prawdziwaLitera);
                }
            }, czasMiedzyKlatkami);
        }

        function zakonczLosowanie(liczba, litera) {
            let btn = document.getElementById("przycisk");
            let wynikDiv = document.getElementById("wynik");
            let ramka = document.getElementById("ramka");

            wynikDiv.classList.remove("spinning");
            ramka.classList.remove("migajace-swiatla");
            
            wynikDiv.innerText = litera + " " + liczba;
            wynikDiv.classList.add("pop");

            wylosowane.push(liczba);
            wylosowane.sort((a, b) => a - b);
            document.getElementById("licznik").innerText = wylosowane.length;

            let kafelkiHTML = wylosowane.map(num => {
                let lit = przypiszLitere(num);
                let extraStyl = (num === liczba) ? 'style="border-color: #00ffff; box-shadow: 0 0 10px #00ffff; background: rgba(0,68,68,0.9); color: #00ffff;"' : '';
                return `<div class="kafelek" ${extraStyl}>${lit}${num}</div>`;
            }).join("");

            document.getElementById("lista-wylosowanych").innerHTML = kafelkiHTML;
            czyLosuje = false;
            
            if (pula.length === 0) {
                btn.innerText = "KONIEC GRY";
            } else {
                btn.disabled = false;
            }
        }
    </script>

</body>
</html>
