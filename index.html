<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maszyna Bingo - Brand New Bingo$$$</title>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            
            /* Tło z okładki singla */
            background-image: url('8bf716558c71408f075dc2e8411f1106.1000x1000x1.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            
            color: #ffffff;
            padding: 20px 10px; 
            margin: 0;
            min-height: 100vh;
        }

        /* --- SZYLD Z NAPISEM BRAND NEW BINGO$$$ --- */
        .szyld {
            background: transparent;
            color: #00ffff; 
            font-size: 30px;
            font-weight: 900;
            font-style: italic; 
            letter-spacing: 1px;
            /* Usunięte text-transform: lowercase, żeby zachować wielkie litery z Twojego życzenia */
            padding: 10px;
            margin-bottom: 25px;
            text-shadow: 0 0 8px #00ffff, 0 0 15px #00e5ff, 0 0 25px rgba(0, 255, 255, 0.8);
            animation: pulsowanie-napis 2s infinite alternate;
        }

        @keyframes pulsowanie-napis {
            from { filter: brightness(1); text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff; }
            to { filter: brightness(1.2); text-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff, 0 0 40px #00ffff; }
        }

        /* --- OBUDOWA MASZYNY (Kształt emotki w kolorach albumu) --- */
        .maszyna-kasyno {
            background: linear-gradient(135deg, rgba(74, 15, 13, 0.95) 0%, rgba(31, 8, 6, 0.95) 100%);
            border-radius: 25px;
            padding: 35px 25px;
            max-width: 380px;
            margin: 0 auto;
            border: 4px solid #ff6600;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 25px rgba(255, 102, 0, 0.4);
            position: relative;
            backdrop-filter: blur(12px);
        }

        /* Ramka bębna z emotki, w barwach albumu */
        .ramka-bebna {
            background: #1a0202; 
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            border: 2px solid #ffcc00;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9), 0 0 15px rgba(255, 204, 0, 0.3);
        }

        /* Ekran z półkolami z emotki */
        .ekran-walec {
            background-color: #080101; 
            height: 150px;
            width: 100%;
            max-width: 200px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            border: 1px solid #2a0808;
        }

        /* Górne półkole (Cyjan) */
        .ekran-walec::before {
            content: ''; 
            position: absolute; 
            top: -15px; 
            width: 50px; 
            height: 30px;
            background-color: #00ffff;
            border-radius: 50%;
            box-shadow: 0 0 12px #00ffff;
        }

        /* Dolne półkole (Ognisty złoty odcień) */
        .ekran-walec::after {
            content: ''; 
            position: absolute; 
            bottom: -15px; 
            width: 50px; 
            height: 30px;
            background-color: #ffcc00;
            border-radius: 50%;
            box-shadow: 0 0 12px #ffcc00;
        }

        #wynik {
            color: #ffcc00; 
            font-size: 65px;
            font-weight: 900;
            z-index: 1;
            text-shadow: 0 0 12px #ff6600, 0 0 20px #cc0000;
        }

        /* Tacka na monety z emotki w klimacie albumu */
        .tacka {
            background-color: #120202;
            height: 30px;
            width: 65%;
            margin: 0 auto 25px auto;
            border-radius: 4px 4px 20px 20px;
            border: 1px solid #ff6600;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.9);
        }

        /* --- GUZIK --- */
        .guzik-automat {
            background: #00ffff;
            color: #000000;
            font-size: 26px;
            font-weight: 900;
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 8px 0 #008b8b, 0 10px 20px rgba(0, 255, 255, 0.4);
            transition: all 0.1s;
        }

        .guzik-automat:active {
            transform: translateY(8px);
            box-shadow: 0 0px 0 #008b8b;
            background: #00e5ff;
        }

        .guzik-automat:disabled {
            background: #333;
            color: #666;
            box-shadow: 0 8px 0 #111;
            cursor: not-allowed;
            transform: none;
        }

        /* --- ANIMACJE --- */
        .spinning {
            color: #552200 !important;
            animation: kręcenie-bebna 0.08s infinite linear;
            text-shadow: none !important;
        }
        .pop {
            animation: pop-out 0.4s ease-out;
        }

        @keyframes kręcenie-bebna {
            0% { transform: translateY(-20px); filter: blur(3px); opacity: 0.7; }
            50% { transform: translateY(20px); filter: blur(1px); opacity: 1; }
            100% { transform: translateY(-20px); filter: blur(3px); opacity: 0.7; }
        }
        @keyframes pop-out {
            0% { transform: scale(0.6); }
            100% { transform: scale(1); }
        }

        /* --- HISTORIA --- */
        .historia { 
            margin-top: 30px; 
            background: rgba(31, 8, 6, 0.85); 
            padding: 20px; 
            border-radius: 20px; 
            text-align: left;
            border: 1px solid rgba(255, 102, 0, 0.4);
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
            backdrop-filter: blur(8px);
        }
        .historia-naglowek { margin-bottom: 15px; font-size: 18px; color: #ffcc00; font-weight: bold; }
        .historia-naglowek span { color: #00ffff; }
        
        #lista-wylosowanych {
            display: flex;
            flex-wrap: wrap; 
            gap: 8px;       
            justify-content: flex-start;
        }

        .kafelek {
            background: rgba(42, 8, 8, 0.9); 
            border: 1px solid #ff6600; 
            border-radius: 8px; 
            padding: 8px 12px;
            font-size: 15px;
            font-weight: bold;
            color: #ffcc00;
            min-width: 45px;
            text-align: center;
            animation: pop-out 0.3s ease-out;
        }
    </style>
</head>
<body>

    <div class="szyld">Brand New Bingo$$$</div>

    <div class="maszyna-kasyno">
        
        <div class="ramka-bebna">
            <div class="ekran-walec">
                <div id="wynik">???</div>
            </div>
        </div>
        
        <div class="tacka"></div>
        
        <button class="guzik-automat" onclick="losuj()" id="przycisk">ZAKRĘĆ</button>

    </div>

    <div class="historia">
        <div class="historia-naglowek">
            Wylosowane chronologicznie (<span><span id="licznik">0</span>/75</span>):
        </div>
        <div id="lista-wylosowanych"></div>
    </div>

    <script>
        let pula = [];
        for (let i = 1; i <= 75; i++) pula.push(i);
        
        let wylosowane = [];
        let czyLosuje = false;

        function przypiszLitere(liczba) {
            if (liczba <= 15) return "B";
            if (liczba <= 30) return "I";
            if (liczba <= 45) return "N";
            if (liczba <= 60) return "G";
            return "O";
        }

        function losuj() {
            if (czyLosuje || pula.length === 0) return;
            czyLosuje = true;
            
            let btn = document.getElementById("przycisk");
            let wynikDiv = document.getElementById("wynik");
            btn.disabled = true;

            wynikDiv.classList.remove("pop");
            wynikDiv.classList.add("spinning");

            let index = Math.floor(Math.random() * pula.length);
            let prawdziwaLiczba = pula.splice(index, 1)[0];
            let prawdziwaLitera = przypiszLitere(prawdziwaLiczba);

            let licznikKlatek = 0;
            let maksymalnaLiczbaKlatek = 18; 
            let czasMiedzyKlatkami = 60; 

            let interwalLosowania = setInterval(() => {
                let falszywaLiczba = Math.floor(Math.random() * 75) + 1;
                wynikDiv.innerText = przypiszLitere(falszywaLiczba) + " " + falszywaLiczba;
                licznikKlatek++;

                if (licznikKlatek >= maksymalnaLiczbaKlatek) {
                    clearInterval(interwalLosowania);
                    zakonczLosowanie(prawdziwaLiczba, prawdziwaLitera);
                }
            }, czasMiedzyKlatkami);
        }

        function zakonczLosowanie(liczba, litera) {
            let btn = document.getElementById("przycisk");
            let wynikDiv = document.getElementById("wynik");

            wynikDiv.classList.remove("spinning");
            
            wynikDiv.innerText = litera + " " + liczba;
            wynikDiv.classList.add("pop");

            wylosowane.push(liczba);
            
            document.getElementById("licznik").innerText = wylosowane.length;

            let kafelkiHTML = wylosowane.map(num => {
                let lit = przypiszLitere(num);
                let extraStyl = (num === liczba) ? 'style="border-color: #00ffff; box-shadow: 0 0 10px #00ffff; background: rgba(0,68,68,0.9); color: #00ffff;"' : '';
                return `<div class="kafelek" ${extraStyl}>${lit}${num}</div>`;
            }).join("");

            document.getElementById("lista-wylosowanych").innerHTML = kafelkiHTML;
            czyLosuje = false;
            
            if (pula.length === 0) {
                btn.innerText = "KONIEC GRY";
            } else {
                btn.disabled = false;
            }
        }
    </script>

</body>
</html>
