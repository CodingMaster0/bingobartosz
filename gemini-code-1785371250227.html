<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maszyna Bingo</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #2c3e50; 
            color: #ecf0f1;
            padding: 20px; 
            margin: 0;
        }
        h1 { margin-top: 10px; color: #f1c40f; }
        
        .wynik-karta {
            background-color: #ecf0f1;
            color: #e74c3c;
            font-size: 80px;
            font-weight: bold;
            margin: 30px auto;
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            max-width: 300px;
        }
        
        button { 
            font-size: 28px; 
            font-weight: bold;
            padding: 20px 40px; 
            background-color: #27ae60; 
            color: white; 
            border: none; 
            border-radius: 15px; 
            cursor: pointer; 
            width: 100%; 
            max-width: 350px; 
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            transition: 0.1s;
        }
        button:active { 
            background-color: #2ecc71; 
            transform: translateY(4px); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .historia { 
            margin-top: 40px; 
            font-size: 18px; 
            background: #34495e; 
            padding: 20px; 
            border-radius: 15px; 
            text-align: left;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            word-wrap: break-word;
            line-height: 1.6;
        }
        .historia span { color: #f1c40f; font-weight: bold; }
    </style>
</head>
<body>

    <h1>BINGO 1-75</h1>
    
    <div class="wynik-karta" id="wynik">???</div>
    
    <button onclick="losuj()" id="przycisk">LOSUJ</button>

    <div class="historia">
        Wylosowane liczby (<span><span id="licznik">0</span>/75</span>):<br><br>
        <div id="lista-wylosowanych">-</div>
    </div>

    <script>
        // Tworzymy pulę liczb od 1 do 75
        let pula = [];
        for (let i = 1; i <= 75; i++) pula.push(i);
        
        let wylosowane = [];

        function losuj() {
            if (pula.length === 0) {
                document.getElementById("wynik").innerText = "KONIEC";
                document.getElementById("wynik").style.fontSize = "50px";
                let btn = document.getElementById("przycisk");
                btn.disabled = true;
                btn.innerText = "Wszystkie wylosowane!";
                return;
            }

            // Losujemy indeks z dostępnej puli
            let index = Math.floor(Math.random() * pula.length);
            // Wyciągamy liczbę z puli
            let liczba = pula.splice(index, 1)[0];
            
            // Dodajemy do wylosowanych i sortujemy
            wylosowane.push(liczba);
            wylosowane.sort((a, b) => a - b);

            // Sprawdzamy literę
            let litera = "";
            if (liczba <= 15) litera = "B";
            else if (liczba <= 30) litera = "I";
            else if (liczba <= 45) litera = "N";
            else if (liczba <= 60) litera = "G";
            else litera = "O";

            // Aktualizujemy wygląd na stronie
            document.getElementById("wynik").innerText = litera + " " + liczba;
            document.getElementById("licznik").innerText = wylosowane.length;
            document.getElementById("lista-wylosowanych").innerText = wylosowane.join(", ");
        }
    </script>

</body>
</html>
